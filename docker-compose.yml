version: '3.8'

services:
  enso_dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: enso-dashboard:latest
    container_name: enso_dashboard
    restart: always
    ports:
      - "8082:8082"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
