<div class="chart-card">
  <div class="chart-header">
    <div>
      <div class="chart-title">Contexto histórico ENOS en Perú</div>
      <div class="chart-sub">
        Serie reconstruida a partir de NOAA CPC (ERSST v5) vía ggweather.com; 2025-2026 son
        valores provisionales. Para cifras oficiales exactas consulte cpc.ncep.noaa.gov.
      </div>
    </div>
  </div>
  <app-plotly-chart *ngIf="oniFigure" [figure]="oniFigure"></app-plotly-chart>
</div>

<div class="chart-card">
  <div class="chart-title mb-3">Grandes eventos ENOS en Perú</div>
  <div class="event-row">
    <app-event-card *ngFor="let ev of events" [event]="ev"></app-event-card>
  </div>
</div>
