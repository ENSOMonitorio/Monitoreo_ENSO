name: CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "pipeline/**"
      - "tests/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "pipeline/**"
      - "tests/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".github/workflows/**"

jobs:
  test:
    name: Tests (build imagen + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen de la app
        run: docker build -f docker/Dockerfile -t enso-dashboard:ci .

      - name: Correr pytest dentro de la imagen
        run: |
          docker run --rm --user root \
            -v "${{ github.workspace }}:/repo" -w /repo \
            enso-dashboard:ci \
            sh -c "pip install -q pytest && python -m pytest tests -v"

  deploy:
    name: Deploy a producción
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH (comando restringido en el servidor)
        env:
          SSH_KEY: ${{ secrets.ENSO_DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.ENSO_DEPLOY_HOST }}
        run: |
          set -e

          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ]; then
            echo "::error::Falta ENSO_DEPLOY_HOST o ENSO_DEPLOY_SSH_KEY en los secrets del repo."
            exit 1
          fi

          # Saca espacios/saltos de línea invisibles que a veces quedan al
          # pegar el secret (causa típica de "hostname contains invalid characters").
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')"
          echo "HOST recibido, entre corchetes para ver si hay algo raro: [$SSH_HOST]"
          if ! printf '%s' "$SSH_HOST" | grep -qE '^[A-Za-z0-9.-]+$'; then
            echo "::error::ENSO_DEPLOY_HOST tiene caracteres inválidos: [$SSH_HOST]. Debe ser solo la IP o el dominio, sin comillas ni espacios."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "== validando formato de la llave privada =="
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/derived_pub 2>/tmp/keygen_err; then
            echo "::error::La llave privada en ENSO_DEPLOY_SSH_KEY no tiene un formato válido."
            cat /tmp/keygen_err
            exit 1
          fi
          echo "Llave cargada OK, fingerprint:"
          ssh-keygen -lf /tmp/derived_pub

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # El comando real que corre lo decide authorized_keys en el
          # servidor (forced command) — esto solo dispara la conexión.
          ssh -v -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            root@"$SSH_HOST" deploy
